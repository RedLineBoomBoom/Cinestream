name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Cinestream Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinestream-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.VERSION }}
          name: Cinestream Android & TV App v${{ steps.app_version.outputs.VERSION }} (Full Production Release)
          body: |
            ## 🎬 Cinestream App (Android & Android TV) • v${{ steps.app_version.outputs.VERSION }}
            Official production release package for Cinestream.

            ### ✨ Key Features
            - **100% Ad-Free**: No pop-ups, malicious redirects, or intrusive banner ads.
            - **Multi-Server Streaming**: Automated failover between high-speed servers.
            - **Android TV & Remote Navigation**: Full D-pad remote control support for TV boxes and Smart TVs.
            - **Live Danmaku Comments**: Synchronized real-time bullet reactions across community viewers.
            - **WebRTC Watch Party**: Host and join serverless synced watch sessions with in-player chat.
            - **Lightweight**: Low battery usage with hardware GPU rendering.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
